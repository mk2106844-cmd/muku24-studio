function txt(c,t,x,y,mw,size,font,col,al){let s=size;do{c.font=font.replace('#',s);s--}while(c.measureText(t).width>mw&&s>10);
 c.fillStyle=col;c.textAlign=al||'left';c.fillText(t,x,y)}
function qr(c,t,x,y,s){const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount(),m=s/n;c.fillStyle='#000';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))c.fillRect(Math.floor(x+k*m),Math.floor(y+r*m),Math.ceil(m)+1,Math.ceil(m)+1)}

 if(photo){const x=152,y=490,w=476,h=586;c.save();c.beginPath();c.roundRect(x,y,w,h,34);c.clip();
  const s=Math.max(w/photo.width,h/photo.height),pw=photo.width*s,ph=photo.height*s;c.drawImage(photo,x+(w-pw)/2,y+(h-ph)/2,pw,ph);c.restore()}

 const trs=[...document.querySelectorAll('#rows .row')],X=[40,214,403,587,795,987];
 trs.forEach((r,ri)=>{const top=168+48*ri,vals=[...r.querySelectorAll('input')].map(i=>i.value.trim());
  if(ri>0){c.strokeStyle='#000';c.lineWidth=3;c.beginPath();X.forEach(x=>{c.moveTo(x,top-1);c.lineTo(x,top+48)});c.moveTo(X[0]-1,top+48);c.lineTo(X[5]+1,top+48);c.stroke()}
  vals.forEach((t,i)=>txt(c,t,(X[i]+X[i+1])/2,top+32,X[i+1]-X[i]-14,22,'#px "Times New Roman",serif','#111','center'))});

function dl(w){const cf=document.getElementById('cf'),cb=document.getElementById('cb');let c=cf;
 if(w==1)c=cb;
 if(w==2){const sc=cf.width/cb.width;c=document.createElement('canvas');c.width=cf.width;c.height=cf.height+Math.round(cb.height*sc)+60;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(cf,0,0);x.drawImage(cb,0,cf.height+60,cf.width,Math.round(cb.height*sc))}
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=['front','back','both'][w]+'.png';a.click()}

const pst=t=>document.getElementById('pst').textContent=t;
async function loadPdfJs(){if(window.pdfjsWorker)return;
 // worker ko normal <script> se load karte hain (blob worker kuch browsers me file:// par fail hota hai)
 const U='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 await new Promise((res,rej)=>{const s=document.createElement('script');s.src=U;s.onload=res;s.onerror=()=>rej(new Error('PDF worker load nahi hua, internet check karein'));document.head.appendChild(s)});
 pdfjsLib.GlobalWorkerOptions.workerSrc=U}
function loadOcr(){return window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');
 s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('OCR library load nahi hui, internet check karein'));document.head.appendChild(s)})}
const HV=new Set(['stateut','district','sub','village','s','no','ss','owner','name','identifier','type','share','extent','total','area','default','hectare','unit']);
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function joinLines(ls){let o='';ls.forEach(t=>{if(!o){o=t;return}const a=o.slice(-1),b=t[0];
 if((/[0-9.]/.test(a)&&/[0-9.]/.test(b))||/[a-z]/.test(b))o+=t;else o+=' '+t});return o}
// find anchor phrase on one line (allows 1 missed token); returns {a:first,z:last matched}
function findSeq(W,seq,minX){for(const w0 of W){if(norm(w0.t)!==seq[0]||(minX!==undefined&&w0.x0<=minX))continue;let last=w0,miss=0;const mm=seq.length>=4?1:0;
 for(let k=1;k<seq.length;k++){const nx=W.filter(w=>norm(w.t)===seq[k]&&Math.abs(w.cy-last.cy)<last.h*0.7&&w.x0>=last.x1-2&&w.x0-last.x1<last.h*4).sort((a,b)=>a.x0-b.x0)[0];
  if(nx)last=nx;else if(++miss>mm)break}
 if(miss<=mm)return {a:w0,z:last}}return null}
function lineVal(W,anc,stopX,cont){const L=anc.z,rx=/^[A-Za-z0-9.,'\/&()-]+$/;
 let ws=W.filter(w=>Math.abs(w.cy-L.cy)<L.h*0.7&&w.x0>=L.x1-2&&w.x0<stopX&&rx.test(w.t)).sort((a,b)=>a.x0-b.x0).map(w=>w.t);
 if(cont)ws=ws.concat(W.filter(w=>w.cy-L.cy>L.h*1.2&&w.cy-L.cy<L.h*2.6&&w.x0<stopX&&w.x0>=anc.a.x0-6&&/^[A-Za-z.'-]+$/.test(w.t)).sort((a,b)=>a.x0-b.x0).map(w=>w.t));
 return ws.join(' ').replace(/[\s,]+$/,'').trim()}
function field(P,seq,stopSeq,cont){for(const W of P){const a=findSeq(W,seq);if(!a)continue;
 let stop=1e9;if(stopSeq){const b=findSeq(W,stopSeq,a.z.x1);if(b&&Math.abs(b.a.cy-a.z.cy)<a.z.h)stop=b.a.x0-8}
 const v=lineVal(W,a,stop,cont);if(v)return v}return ''}
async function importPdf(file){
 let worker;
 try{pst('PDF khol raha hoon...');await loadPdfJs();await loadOcr();
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'6'});
  const P=[],canv=[],n=Math.min(pdf.numPages,8);
  for(let p=1;p<=n;p++){pst('OCR chal raha hai: page '+p+' / '+n+' (1-2 minute lag sakte hain)');
   const pg=await pdf.getPage(p),vp=pg.getViewport({scale:2.07}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
   await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;canv.push(cv);
   const {data}=await worker.recognize(cv);
   P.push((data.words||[]).filter(w=>w.text.trim()&&w.confidence>10).map(w=>({t:w.text.trim(),x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1,cx:(w.bbox.x0+w.bbox.x1)/2,cy:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0})))}
  await worker.terminate();worker=null;
  const F={name:'',father:'',dob:'',gender:'',mobile:'',fid:'',address:'',aadhaar:''};
  F.name=field(P,['farmer','name','as','per','aadhaar','in','english'],['farmers','name','in','local'],true);
  F.father=field(P,['identifier','name','in','english'],['identifier','name','in','local'],true);
  F.address=field(P,['address','in','english'],['address','in','local'],true);
  const gd=field(P,['gender'],['caste']);F.gender=(gd.match(/Male|Female|Transgender|Other/i)||[gd])[0];
  const db=field(P,['date','of','birth'],['age']);F.dob=(db.match(/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{4}/)||[db.replace(/\s/g,'')])[0];
  const mb=field(P,['mobile','number'],['email']).replace(/\D/g,'');F.mobile=mb.length>=10?mb.slice(0,10):mb;
  for(const W of P){const a=findSeq(W,['farmer','id']);if(!a)continue;
   const c=W.filter(w=>w.cy>a.z.cy&&w.cy-a.z.cy<a.z.h*6&&w.x0<a.a.x0+400&&w.t.replace(/\D/g,'').length>=9&&!/_/.test(w.t))[0];if(c){F.fid=c.t.replace(/\D/g,'');break}}
  for(const k in F)document.getElementById('i_'+k).value=F[k];
  // land table
  const rowsOut=[];let hp=-1;
  P.forEach((W,i)=>{if(hp<0&&findSeq(W,['land','ownership','details']))hp=i});
  if(hp>=0){const hd=findSeq(P[hp],['land','ownership','details']).z;
   const below=P[hp].filter(w=>w.cy>hd.cy+hd.h*1.5).sort((a,b)=>a.cy-b.cy||a.x0-b.x0);
   const minX=Math.min(...below.filter(w=>/[A-Za-z0-9]/.test(w.t)).map(w=>w.x0));
   const first=below.find(w=>w.x0<minX+250&&/^[A-Z]{3,}$/.test(w.t)&&!HV.has(norm(w.t)));
   const hdrWords=first?below.filter(w=>w.cy<first.cy-first.h*0.5):below;
   const dataHp=first?below.filter(w=>w.cy>=first.cy-first.h*0.5):[];
   // column edges: the form is a fixed template (12 columns); header words only fix the horizontal offset
   const REF=[81,263,420,578,732,836,941,1089,1272,1419,1566,1733];
   const diffs=hdrWords.filter(w=>HV.has(norm(w.t))).map(w=>{const d=REF.map(r=>r-w.x0).sort((p,q)=>Math.abs(p)-Math.abs(q))[0];return d}).filter(d=>Math.abs(d)<40).sort((p,q)=>p-q);
   let edges=[];if(diffs.length>=4){const off=diffs[Math.floor(diffs.length/2)];edges=REF.map(r=>r-off)}
   // data pages: stop at "Annexure" (everything after is consent text)
   const dps=[dataHp];let stop=false;
   P.slice(hp+1).forEach(W=>{if(stop)return;const an=W.find(w=>norm(w.t)==='annexure');
    if(an){stop=true;dps.push(W.filter(w=>w.cy<an.cy-an.h))}else dps.push(W)});
   const alnum=w=>/[A-Za-z0-9]/.test(w.t);
   if(edges.length>=11){
    const col=x=>{let c=-1;edges.forEach((e,i)=>{if(e<=x+8)c=i});return c};
    dps.forEach(items=>{const its=items.filter(alnum).map(w=>({...w,c:col(w.x0)})).filter(w=>w.c>=0);
     const c0=its.filter(w=>w.c===0).sort((a,b)=>a.cy-b.cy),tops=[];
     c0.forEach((w,i)=>{if(i===0||w.cy-c0[i-1].cy>w.h*3)tops.push(w.cy)});
     const rs=tops.map(()=>({}));
     its.forEach(w=>{let ri=-1;tops.forEach((tp,i)=>{if(tp<=w.cy+w.h*0.8)ri=i});if(ri<0)return;(rs[ri][w.c]=rs[ri][w.c]||[]).push(w)});
     rs.forEach(r=>{const cell=c=>{if(!r[c])return '';const ws=r[c].sort((a,b)=>a.cy-b.cy||a.x0-b.x0),ls=[];
       ws.forEach(w=>{const l=ls[ls.length-1];if(l&&Math.abs(l.cy-w.cy)<w.h*0.6){l.t.push(w.t)}else ls.push({cy:w.cy,t:[w.t]})});
       return joinLines(ls.map(l=>l.t.join(' '))).replace(/[\s,]+$/,'')};
      const row=[cell(0),cell(2),cell(3),cell(4),cell(10)];
      if(/[A-Za-z]/.test(row[0])&&/^\d+/.test(row[3]))rowsOut.push(row)})})}}
  const box=document.getElementById('rows');box.innerHTML='';
  rowsOut.slice(0,MAXR).forEach(r=>addRow(r));if(!box.children.length)addRow();
  // photo: fixed position under the "Farmer Photograph" label on the page that has it
  photo=null;
  for(let i=0;i<P.length&&!photo;i++){const a=findSeq(P[i],['farmer','photograph']);if(!a)continue;
   const tw=a.z.x1-a.a.x0,x=a.z.x1-0.57*tw,y=a.z.y1+0.08*tw,w=0.57*tw,hh=0.71*tw,cv=document.createElement('canvas');cv.width=w;cv.height=hh;
   cv.getContext('2d').drawImage(canv[i],x,y,w,hh,0,0,w,hh);photo=await img(cv.toDataURL('image/png'))}
  draw();
  const filled=Object.entries(F).filter(([k,v])=>v).length;
  pst('Ho gaya: '+filled+' fields, '+Math.min(rowsOut.length,MAXR)+' land row(s), photo '+(photo?'mil gayi':'nahi mili')+'. OCR se padha gaya hai, har number card se pehle ek baar milayein. Aadhaar PDF mein nahi hota, use haath se bharein.'+
   (rowsOut.length>MAXR?' Dhyan: PDF mein '+rowsOut.length+' rows thi, card par sirf '+MAXR+' aayi.':''));
 }catch(e){console.error(e);if(worker)try{await worker.terminate()}catch(_){}pst('PDF padh nahi paya: '+e.message)}}
document.getElementById('pdf').onchange=e=>{if(e.target.files[0])importPdf(e.target.files[0])};
document.fonts.ready.then(()=>{addRow(['ASSAM','LAKHIPUR','SALDHOWA','363','0.016725'])});
</script></body></html>
