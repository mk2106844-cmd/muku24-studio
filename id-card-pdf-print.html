    // --- UTILITIES FOR DETECTION AND PRESET HANDLING ---
    function detectCardBounds(canvas, searchRegion = 'full') {
      let targetCanvas;
      if (canvas instanceof HTMLImageElement) {
        targetCanvas = document.createElement('canvas');
        targetCanvas.width = canvas.naturalWidth;
        targetCanvas.height = canvas.naturalHeight;
        const ctx = targetCanvas.getContext('2d');
        if (ctx) ctx.drawImage(canvas, 0, 0);
      } else {
        targetCanvas = canvas;
      }
      
      const w = targetCanvas.width;
      const h = targetCanvas.height;
      const ctx = targetCanvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) return { x: 0.1, y: 0.1, width: 0.8, height: 0.8 };
      
      let startY = 0;
      let endY = h;
      if (searchRegion === 'top') {
        endY = Math.floor(h / 2);
      } else if (searchRegion === 'bottom') {
        startY = Math.floor(h / 2);
      }
      const scanH = endY - startY;
      const imgData = ctx.getImageData(0, startY, w, scanH);
      const data = imgData.data;
      
      const rowActivity = new Float32Array(scanH);
      const colActivity = new Float32Array(w);
      const sampleStep = 4;
      
      for (let y = 0; y < scanH; y += sampleStep) {
        for (let x = 0; x < w; x += sampleStep) {
          const idx = (y * w + x) * 4;
          const r = data[idx];
          const g = data[idx+1];
          const b = data[idx+2];
          const dist = (255 - r) + (255 - g) + (255 - b);
          if (dist > 45) {
            rowActivity[y] += dist;
            colActivity[x] += dist;
          }
        }
      }
      
      let top = 0;
      for (let y = 0; y < scanH; y++) {
        if (rowActivity[y] > (w / sampleStep) * 2.0) { top = y; break; }
      }
      let bottom = scanH - 1;
      for (let y = scanH - 1; y >= 0; y--) {
        if (rowActivity[y] > (w / sampleStep) * 2.0) { bottom = y; break; }
      }
      let left = 0;
      for (let x = 0; x < w; x++) {
        if (colActivity[x] > (scanH / sampleStep) * 2.0) { left = x; break; }
      }
      let right = w - 1;
      for (let x = w - 1; x >= 0; x--) {
        if (colActivity[x] > (scanH / sampleStep) * 2.0) { right = x; break; }
      }
      
      const padding = 10;
      top = Math.max(0, top - padding);
      bottom = Math.min(scanH - 1, bottom + padding);
      left = Math.max(0, left - padding);
      right = Math.min(w - 1, right + padding);
      
      const detectedWidth = right - left;
      const detectedHeight = bottom - top;
      
      if (detectedWidth < w * 0.15 || detectedHeight < scanH * 0.1) {
        return { x: 0.1, y: (startY + scanH * 0.1) / h, width: 0.8, height: (scanH * 0.8) / h };
      }
      return {
        x: left / w,
        y: (startY + top) / h,
        width: detectedWidth / w,
        height: detectedHeight / h
      };
    }

    function getPresetCropRegion(preset, isStacked) {
      if (isStacked) {
        return {
          front: { x: 0.05, y: 0.03, width: 0.9, height: 0.44 },
          back: { x: 0.05, y: 0.53, width: 0.9, height: 0.44 },
          hasBack: true,
        };
      }
      switch (preset) {
        case 'aadhaar_bottom':
          return {
            front: { x: 0.04, y: 0.64, width: 0.44, height: 0.33 },
            back: { x: 0.52, y: 0.64, width: 0.44, height: 0.33 },
            hasBack: true,
          };
        case 'pan_bottom':
          return {
            front: { x: 0.28, y: 0.68, width: 0.44, height: 0.28 },
            back: { x: 0.28, y: 0.68, width: 0.44, height: 0.28 },
            hasBack: false,
          };
        case 'voter_dl':
          return {
            front: { x: 0.05, y: 0.1, width: 0.43, height: 0.4 },
            back: { x: 0.52, y: 0.1, width: 0.43, height: 0.4 },
            hasBack: true,
          };
        case 'full_page':
          return {
            front: { x: 0.0, y: 0.0, width: 1.0, height: 1.0 },
            back: { x: 0.0, y: 0.0, width: 1.0, height: 1.0 },
            hasBack: false,
          };
        default:
          return {
            front: { x: 0.05, y: 0.05, width: 0.9, height: 0.42 },
            back: { x: 0.05, y: 0.53, width: 0.9, height: 0.42 },
            hasBack: true,
          };
      }
    }

    // PDF processing utilizing HTML5 Canvas and dynamic pages stacking
    async function renderPdfToCanvas(file, password) {
      const arrayBuffer = await file.arrayBuffer();
      try {
        const loadingTask = pdfjs.getDocument({ data: arrayBuffer, password: password });
        const pdfDoc = await loadingTask.promise;
        const totalPages = pdfDoc.numPages;
        const pagesToRender = Math.min(totalPages, 2);
        const canvasList = [];
        let maxWidth = 0;
        let totalHeight = 0;
        
        for (let i = 1; i <= pagesToRender; i++) {
          const page = await pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 4.0 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          if (!context) throw new Error('Could not create canvas context');
          
          await page.render({ canvasContext: context, viewport: viewport }).promise;
          canvasList.push(canvas);
          maxWidth = Math.max(maxWidth, canvas.width);
          totalHeight += canvas.height;
        }
        
        const combinedCanvas = document.createElement('canvas');
        combinedCanvas.width = maxWidth;
        combinedCanvas.height = totalHeight;
        const ctx = combinedCanvas.getContext('2d');
        if (!ctx) throw new Error('Could not create combined canvas context');
        
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);
        
        let currentY = 0;
        for (const canvas of canvasList) {
          const xOffset = (maxWidth - canvas.width) / 2;
          ctx.drawImage(canvas, xOffset, currentY);
          currentY += canvas.height;
        }
        
        return {
          dataUrl: combinedCanvas.toDataURL('image/jpeg', 0.95),
          width: maxWidth,
          height: totalHeight,
          totalPages: totalPages,
          isStacked: pagesToRender > 1,
        };
      } catch (error) {
        if (error && (error.name === 'PasswordException' || error.message?.includes('password') || error.code === 1)) {
          throw new Error('PDFPasswordError');
        }
        throw error;
      }
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [cards, setCards] = useState([]);
      const [zoom, setZoom] = useState(0.85);
      const [isProcessing, setIsProcessing] = useState(false);
      const [darkMode, setDarkMode] = useState(false);
      
      // Password modal status
      const [passwordRequired, setPasswordRequired] = useState(false);
      const [passwordFile, setPasswordFile] = useState(null);
      const [passwordValue, setPasswordValue] = useState('');

      // Crop Modal status
      const [activeCropCard, setActiveCropCard] = useState(null);

      // Toast states
      const [toasts, setToasts] = useState([]);

      // Layout Settings
      const [settings, setSettings] = useState({
        cardWidthMm: 85.6,
        cardHeightMm: 54.0,
        gapMm: 2.0,
        rowGapMm: 4.0,
        marginMm: 10.0,
        showCutLines: true,
        showOutline: true,
        outerBorderSize: 0,
        cardBorderRadius: 8,
      });

      // Dark Mode toggle side effect
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const triggerToast = (message, type = 'success') => {
        const id = Math.random().toString(36).substring(2, 9);
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3000);
      };

      const handleFileUpload = async (file) => {
        if (!file) return;
        setIsProcessing(true);
        try {
          if (file.type === 'application/pdf') {
            await processPDF(file);
          } else if (file.type.startsWith('image/')) {
            await processImage(file);
          } else {
            triggerToast('Unsupported file type. Please upload PDFs or Images.', 'error');
          }
        } catch (err) {
          if (err.message === 'PDFPasswordError') {
            setPasswordFile(file);
            setPasswordRequired(true);
          } else {
            triggerToast(`Error processing file: ${err.message}`, 'error');
          }
        } finally {
          setIsProcessing(false);
        }
      };

      const processPDF = async (file, password = '') => {
        const result = await renderPdfToCanvas(file, password);
        const autoPreset = result.isStacked ? 'aadhaar_bottom' : 'aadhaar_bottom';
        const region = getPresetCropRegion(autoPreset, result.isStacked);

        const newCard = {
          id: Math.random().toString(36).substring(2, 9),
          name: file.name.replace(/\.[^/.]+$/, ""),
          dataUrl: result.dataUrl,
          originalDataUrl: result.dataUrl,
          cardPreset: result.isStacked ? 'full_page' : 'aadhaar_bottom',
          isStacked: result.isStacked,
          cropX: region.front.x,
          cropY: region.front.y,
          cropW: region.front.width,
          cropH: region.front.height,
          hasBack: region.hasBack,
          backCropX: region.back.x,
          backCropY: region.back.y,
          backCropW: region.back.width,
          backCropH: region.back.height,
        };

        setCards(prev => {
          if (prev.length >= 4) {
            triggerToast('Maximum 4 ID cards can be loaded simultaneously.', 'info');
            return prev;
          }
          return [...prev, newCard];
        });
        triggerToast('PDF loaded and formatted successfully!');
      };

      const processImage = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const dataUrl = e.target.result;
            const newCard = {
              id: Math.random().toString(36).substring(2, 9),
              name: file.name.replace(/\.[^/.]+$/, ""),
              dataUrl: dataUrl,
              originalDataUrl: dataUrl,
              cardPreset: 'full_page',
              isStacked: false,
              cropX: 0.1,
              cropY: 0.1,
              cropW: 0.8,
              cropH: 0.8,
              hasBack: false,
              backCropX: 0.1,
              backCropY: 0.5,
              backCropW: 0.8,
              backCropH: 0.4,
            };

            setCards(prev => {
              if (prev.length >= 4) {
                triggerToast('Maximum 4 ID cards can be loaded simultaneously.', 'info');
                return prev;
              }
              return [...prev, newCard];
            });
            triggerToast('Image loaded successfully!');
            resolve();
          };
          reader.onerror = () => reject(new Error('Failed to read image file'));
          reader.readAsDataURL(file);
        });
      };

      const handlePasswordSubmit = async (e) => {
        e.preventDefault();
        if (!passwordFile) return;
        setIsProcessing(true);
        try {
          await processPDF(passwordFile, passwordValue);
          setPasswordRequired(false);
          setPasswordFile(null);
          setPasswordValue('');

          if (err.message === 'PDFPasswordError') {
            triggerToast('Incorrect password. Please try again.', 'error');

      };

                backCropY: region.back.y,
                backCropW: region.back.width,

              };
            }));

                };
              }));
            };
            reader.readAsDataURL(file);
          }
          triggerToast('Card replaced successfully!');

            width: `${paperWidthPx}px`,

            transform: isPrintView ? 'none' : `scale(${zoom})`,
            transformOrigin: 'center center',
            transition: 'transform 0.15s ease-out',
            boxSizing: 'border-box',
            backgroundColor: '#ffffff',
          }}
        >

                >

    // --- CROP MODAL COMPONENT ---
    function CropModal({ card, onClose, onSave }) {
      const [frontCrop, setFrontCrop] = useState({ x: card.cropX, y: card.cropY, w: card.cropW, h: card.cropH });
      const [backCrop, setBackCrop] = useState({ x: card.backCropX, y: card.backCropY, w: card.backCropW, h: card.backCropH });
      const [hasBack, setHasBack] = useState(card.hasBack);
      const [activeTab, setActiveTab] = useState('front');

      const imgRef = useRef(null);
      const [dragStart, setDragStart] = useState(null);
      const [dragType, setDragType] = useState(null); // 'move' or 'resize'
      const [resizeHandle, setResizeHandle] = useState(null);

      const activeCrop = activeTab === 'front' ? frontCrop : backCrop;
      const setActiveCrop = activeTab === 'front' ? setFrontCrop : setBackCrop;

      // Handle Mouse Dragging & Cropping inside crop box
      const handleMouseDown = (e, type, handle = null) => {
        e.preventDefault();
        const rect = imgRef.current.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) / rect.width;
        const clickY = (e.clientY - rect.top) / rect.height;

        setDragStart({ x: clickX, y: clickY, crop: { ...activeCrop } });
        setDragType(type);
        setResizeHandle(handle);
      };

      const handleMouseMove = (e) => {
        if (!dragStart) return;
        const rect = imgRef.current.getBoundingClientRect();
        const currentX = (e.clientX - rect.left) / rect.width;
        const currentY = (e.clientY - rect.top) / rect.height;

        const dx = currentX - dragStart.x;
        const dy = currentY - dragStart.y;

        if (dragType === 'move') {
          setActiveCrop({
            ...dragStart.crop,
            x: Math.max(0, Math.min(1 - dragStart.crop.w, dragStart.crop.x + dx)),
            y: Math.max(0, Math.min(1 - dragStart.crop.h, dragStart.crop.y + dy)),
          });
        } else if (dragType === 'resize') {
          let { x, y, w, h } = dragStart.crop;

          if (resizeHandle.includes('e')) w = Math.max(0.05, Math.min(1 - x, w + dx));
          if (resizeHandle.includes('s')) h = Math.max(0.05, Math.min(1 - y, h + dy));
          if (resizeHandle.includes('w')) {
            const newX = Math.max(0, Math.min(x + w - 0.05, x + dx));
            w = w + (x - newX);
            x = newX;
          }
          if (resizeHandle.includes('n')) {
            const newY = Math.max(0, Math.min(y + h - 0.05, y + dy));
            h = h + (y - newY);
            y = newY;
          }

          setActiveCrop({ x, y, w, h });
        }
      };

      const handleMouseUp = () => {
        setDragStart(null);
        setDragType(null);
        setResizeHandle(null);
      };

      useEffect(() => {
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [dragStart, dragType, resizeHandle, activeTab, frontCrop, backCrop]);

      const handleAutoDetect = () => {
        try {
          const detected = detectCardBounds(imgRef.current, activeTab === 'front' ? 'top' : 'bottom');
          setActiveCrop({ x: detected.x, y: detected.y, w: detected.width, h: detected.height });
        } catch (e) {
          alert("Auto-detection failed for this image format. Please adjust manually.");
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/45 backdrop-blur-md">
          <div className="flex flex-col w-full max-w-5xl h-[90vh] bg-white/75 dark:bg-slate-950/70 backdrop-blur-lg rounded-2xl shadow-2xl overflow-hidden border border-white/50 dark:border-white/5">
            
            {/* Modal Header */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-white/20 dark:border-slate-800/60 bg-white/40 dark:bg-slate-950/20 backdrop-blur-md">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-blue-500/10 text-blue-600 dark:text-blue-400 rounded-lg">
                  <IconCrop size={20} />
                </div>
                <div>
                  <h3 className="font-bold text-slate-800 dark:text-slate-100 text-sm md:text-base">PDF ID Card Cropper</h3>
                  <p className="text-[11px] text-slate-400 dark:text-slate-500 font-medium">Fine-tune the print crop boundary coordinates manually.</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">✕</button>
            </div>

            {/* Modal Content Column */}
            <div className="flex-1 grid grid-cols-1 lg:grid-cols-4 overflow-hidden">
              
              {/* Left Toolbar Column */}
              <div className="p-5 border-r border-white/20 dark:border-slate-800 space-y-6 overflow-y-auto bg-slate-500/5">
                
                {/* Back side control checkbox */}
                <div className="p-3.5 bg-white/50 dark:bg-slate-900/40 rounded-xl border border-white/40 dark:border-white/5 space-y-3">
                  <label className="flex items-center justify-between cursor-pointer">
                    <span className="text-xs font-bold text-slate-700 dark:text-slate-300">Has Back Side Page</span>
                    <input
                      type="checkbox"
                      checked={hasBack}
                      onChange={(e) => setHasBack(e.target.checked)}
                      className="w-4 h-4 text-blue-600 bg-slate-50 rounded"
                    />
                  </label>
                </div>

                {/* Tab selector */}
                {hasBack && (
                  <div className="flex bg-white/40 dark:bg-slate-900/40 p-1 rounded-xl border border-white/20 dark:border-white/5">
                    <button
                      onClick={() => setActiveTab('front')}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                        activeTab === 'front' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'
                      }`}
                    >
                      Front Page
                    </button>
                    <button
                      onClick={() => setActiveTab('back')}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                        activeTab === 'back' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'
                      }`}
                    >
                      Back Page
                    </button>
                  </div>
                )}

                {/* Auto detect button */}
                <button
                  onClick={handleAutoDetect}
                  className="w-full flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-bold rounded-xl shadow-lg shadow-blue-500/10 hover:opacity-90 active:scale-95 transition-all duration-150"
                >
                  <IconShieldCheck className="text-white" />
                  <span>Auto-Detect Smart Crop</span>
                </button>

                {/* Numeric adjust bounds */}
                <div className="space-y-4">
                  <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Crop Coordinates (Percent)</h4>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">X Coord</label>
                      <input
                        type="number"
                        value={Math.round(activeCrop.x * 100)}
                        onChange={(e) => setActiveCrop(prev => ({ ...prev, x: Number(e.target.value) / 100 }))}
                        className="w-full px-2 py-1.5 bg-white/40 dark:bg-slate-900/50 border border-white/20 dark:border-white/5 rounded-lg text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">Y Coord</label>
                      <input
                        type="number"
                        value={Math.round(activeCrop.y * 100)}
                        onChange={(e) => setActiveCrop(prev => ({ ...prev, y: Number(e.target.value) / 100 }))}
                        className="w-full px-2 py-1.5 bg-white/40 dark:bg-slate-900/50 border border-white/20 dark:border-white/5 rounded-lg text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">Width</label>
                      <input
                        type="number"
                        value={Math.round(activeCrop.w * 100)}
                        onChange={(e) => setActiveCrop(prev => ({ ...prev, w: Number(e.target.value) / 100 }))}
                        className="w-full px-2 py-1.5 bg-white/40 dark:bg-slate-900/50 border border-white/20 dark:border-white/5 rounded-lg text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-400 mb-1">Height</label>
                      <input
                        type="number"
                        value={Math.round(activeCrop.h * 100)}
                        onChange={(e) => setActiveCrop(prev => ({ ...prev, h: Number(e.target.value) / 100 }))}
                        className="w-full px-2 py-1.5 bg-white/40 dark:bg-slate-900/50 border border-white/20 dark:border-white/5 rounded-lg text-xs"
                      />
                    </div>
                  </div>
                </div>

                {/* Helpful Tip */}
                <div className="p-3 bg-blue-500/5 border border-blue-500/10 rounded-xl flex gap-2">
                  <IconHelp className="text-blue-500 shrink-0 w-4 h-4" />
                  <p className="text-[10px] text-slate-500 leading-normal">
                    Drag the crop region box inside the canvas viewport, or grab the handles to scale dynamically.
                  </p>
                </div>

              </div>

              {/* Center Canvas Viewport Column (3 cols) */}
              <div className="lg:col-span-3 p-6 flex flex-col items-center justify-center bg-slate-950/5 overflow-auto relative">
                
                <div className="relative select-none max-w-full max-h-[60vh] border border-slate-300 shadow-xl bg-white rounded-lg overflow-hidden">
                  <img
                    ref={imgRef}
                    src="https://smartcsctools.org/{card.originalDataUrl}"
                    className="max-w-full max-h-[60vh] block pointer-events-none"
                    alt="Document canvas"
                  />
                  
                  {/* Absolute Crop Bounds Resizer UI overlay */}
                  <div
                    style={{
                      position: 'absolute',
                      left: `${activeCrop.x * 100}%`,
                      top: `${activeCrop.y * 100}%`,
                      width: `${activeCrop.w * 100}%`,
                      height: `${activeCrop.h * 100}%`,
                      border: '2px solid #2563eb',
                      boxShadow: '0 0 0 9999px rgba(0, 0, 0, 0.5)',
                      cursor: 'move',
                    }}
                    onMouseDown={(e) => handleMouseDown(e, 'move')}
                  >
                    {/* Resizing Anchor Handles */}
                    {['nw', 'ne', 'se', 'sw', 'n', 's', 'e', 'w'].map((handle) => {
                      let handleStyle = { position: 'absolute', width: '10px', height: '10px', backgroundColor: '#2563eb', border: '1px solid white' };
                      if (handle === 'nw') { handleStyle.top = '-5px'; handleStyle.left = '-5px'; handleStyle.cursor = 'nwse-resize'; }
                      else if (handle === 'ne') { handleStyle.top = '-5px'; handleStyle.right = '-5px'; handleStyle.cursor = 'nesw-resize'; }
                      else if (handle === 'se') { handleStyle.bottom = '-5px'; handleStyle.right = '-5px'; handleStyle.cursor = 'nwse-resize'; }
                      else if (handle === 'sw') { handleStyle.bottom = '-5px'; handleStyle.left = '-5px'; handleStyle.cursor = 'nesw-resize'; }
                      else if (handle === 'n') { handleStyle.top = '-5px'; handleStyle.left = 'calc(50% - 5px)'; handleStyle.cursor = 'ns-resize'; }
                      else if (handle === 's') { handleStyle.bottom = '-5px'; handleStyle.left = 'calc(50% - 5px)'; handleStyle.cursor = 'ns-resize'; }
                      else if (handle === 'e') { handleStyle.right = '-5px'; handleStyle.top = 'calc(50% - 5px)'; handleStyle.cursor = 'ew-resize'; }
                      else if (handle === 'w') { handleStyle.left = '-5px'; handleStyle.top = 'calc(50% - 5px)'; handleStyle.cursor = 'ew-resize'; }

                      return (
                        <div
                          key={handle}
                          style={handleStyle}
                          onMouseDown={(e) => { e.stopPropagation(); handleMouseDown(e, 'resize', handle); }}
                        />
                      );
                    })}
                  </div>
                </div>

              </div>

            </div>

            {/* Modal Actions Footer */}
            <div className="px-6 py-4 border-t border-white/20 dark:border-slate-800 bg-white/40 dark:bg-slate-950/20 backdrop-blur-md flex items-center justify-end gap-3">
              <button
                onClick={onClose}
                className="py-2.5 px-5 bg-white/40 hover:bg-white/70 dark:bg-slate-800/40 dark:hover:bg-slate-800/80 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-bold border border-white/20 dark:border-white/5 transition-all shadow-sm"
              >
                Cancel Adjustments
              </button>
              <button
                onClick={() => onSave({
                  id: card.id,
                  hasBack,
                  cropX: frontCrop.x,
                  cropY: frontCrop.y,
                  cropW: frontCrop.w,
                  cropH: frontCrop.h,
                  backCropX: backCrop.x,
                  backCropY: backCrop.y,
                  backCropW: backCrop.w,
                  backCropH: backCrop.h,
                })}
                className="py-2.5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-xs font-bold rounded-xl shadow-lg shadow-blue-500/10 hover:opacity-95 transition-all"
              >
                Apply Crop Coordinates
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Mount React Node to root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Code Protection & Anti-Theft Security Scripts -->
  <script>
    (function() {
      // 1. Disable Right Click (ContextMenu) with secure toast warning
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showSecurityNotice("Right-click menu has been disabled to protect source code.");
      });

      // 2. Disable standard developer tools shortcuts & site saving commands
      document.addEventListener('keydown', function(e) {
        // F12 key (F12)
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          showSecurityNotice("Developer tools shortcut (F12) is disabled on this portal.");
          return false;
        }

        // Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element Selector)
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
          e.preventDefault();
          showSecurityNotice("Access to developer console is restricted.");
          return false;
        }

        // Ctrl+U / Cmd+U (View Page Source)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
          e.preventDefault();
          showSecurityNotice("Viewing page source is disabled on Smart CSC Tools.");
          return false;
        }

        // Ctrl+S / Cmd+S (Save Page As...)
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
          e.preventDefault();
          showSecurityNotice("Offline page downloading is restricted.");
          return false;
        }
      });

      // Elegant custom warning toast notification creator
      function showSecurityNotice(msg) {
        let container = document.getElementById('security-toast-wrapper');
        if (!container) {
          container = document.createElement('div');
          container.id = 'security-toast-wrapper';
          container.style.cssText = 'position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100000; display: flex; flex-direction: column; gap: 8px; max-width: 90%; width: 380px;';
          document.body.appendChild(container);
        }

        // Remove any duplicate warnings to avoid stacking clutter
        while (container.children.length > 2) {
          container.children[0].remove();
        }

        const toast = document.createElement('div');
        toast.style.cssText = 'background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); color: #f8fafc; border: 1px solid rgba(239, 68, 68, 0.2); border-left: 4px solid #ef4444; padding: 12px 18px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(12px); transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);';
        toast.innerHTML = '<span style="color: #ef4444; font-size: 16px;">🛡️</span> <span style="flex: 1; line-height: 1.4;">' + msg + '</span>';

        container.appendChild(toast);

        // Animate entry
        setTimeout(function() {
          toast.style.opacity = '1';
          toast.style.transform = 'translateY(0)';
        }, 30);

        // Animate exit and auto-delete
        setTimeout(function() {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(12px)';
          setTimeout(function() {
            toast.remove();
          }, 350);
        }, 3500);
      }

      // 3. Subtle background debugger loop to make deep inspection challenging
      setInterval(function() {
        const startTime = performance.now();
        debugger; // This halts executing context if inspection tools are active
